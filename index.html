<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OI Wall Monitor</title>
<style>
  :root {
    --bg: #121310; --panel: #1A1B14; --panel2: #1F2117; --border: #2E2F24;
    --text: #ECE7D8; --muted: #83866F; --amber: #D9A441; --amber-dim: #8A6E2E;
    --green: #8FBB93; --red: #E29891;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, 'Segoe UI', Arial, sans-serif;
    padding: 18px 16px 40px;
  }
  .mono { font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; }
  .wrap { max-width: 720px; margin: 0 auto; }
  .header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 16px; }
  .title { font-size: 11px; text-transform: uppercase; letter-spacing: 0.16em; color: var(--muted); }
  .ts { font-size: 11px; color: var(--muted); }

  .status-card {
    background: linear-gradient(180deg, #1D1E15, #171812);
    border: 1px solid var(--border);
    border-left: 3px solid var(--amber);
    border-radius: 4px;
    padding: 20px 22px;
    margin-bottom: 20px;
  }
  .status-card.grabbed { border-left-color: var(--amber); }
  .status-card.reversed { border-left-color: var(--green); }
  .status-eyebrow { font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.12em; color: var(--amber-dim); margin-bottom: 8px; }
  .status-headline { font-size: 20px; font-weight: 700; margin-bottom: 12px; }
  .status-sub { font-size: 13px; color: #D9D5C4; line-height: 1.6; }

  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
  .card { background: var(--panel); border-radius: 10px; padding: 12px 14px; border: 1px solid var(--border); }
  .lbl { font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin-bottom: 4px; }
  .val { font-size: 18px; font-weight: 700; }
  .sub { font-size: 12px; color: var(--muted); margin-top: 2px; }

  .distance-track { width: 100%; height: 6px; background: rgba(255,255,255,0.06); border-radius: 3px; margin-top: 8px; overflow: hidden; }
  .distance-fill { height: 100%; background: var(--amber); border-radius: 3px; }

  .section-title { font-size: 11px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); margin: 22px 0 10px; padding-top: 16px; border-top: 1px solid var(--border); }

  .alert-feed { max-height: 400px; overflow-y: auto; }
  .alert-item { background: var(--panel2); border-radius: 8px; padding: 10px 12px; margin-bottom: 6px; font-size: 12.5px; line-height: 1.5; border-left: 2px solid var(--border); }
  .alert-item.grab { border-left-color: var(--amber); color: #F0DFB0; }
  .alert-item.reversal { border-left-color: var(--green); color: #C9E5CC; }
  .alert-item.defended { color: var(--muted); }

  .disclaimer { font-size: 11px; color: var(--muted); line-height: 1.6; margin-top: 24px; padding-top: 14px; border-top: 1px solid var(--border); }
  .error { background: #241514; border: 1px solid #4A2320; color: #E29891; padding: 12px; border-radius: 8px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <div class="title">OI Wall Monitor — Nifty</div>
    <div class="ts mono" id="ts">loading...</div>
  </div>
  <div id="content">Loading data...</div>
</div>

<script>
const DATA_URL = "https://raw.githubusercontent.com/rashmiranjan1434-jpg/dhan-trading-guard/main/oi_wall_data.json";
const REFRESH_MS = 60000;

function fmtNum(n) {
  if (n === null || n === undefined) return "-";
  return Math.round(n).toLocaleString('en-IN');
}

async function load() {
  try {
    const res = await fetch(DATA_URL + "?t=" + Date.now());
    if (!res.ok) throw new Error("HTTP " + res.status);
    const d = await res.json();
    render(d);
  } catch (e) {
    document.getElementById('content').innerHTML =
      '<div class="error">Could not load data: ' + e.message + '<br>Check that oi_wall_data.json exists in the repo (it appears after the first workflow run).</div>';
  }
}

function alertClass(text) {
  if (text.includes('GRAB CONFIRMED')) return 'grab';
  if (text.includes('REVERSAL CONFIRMED')) return 'reversal';
  if (text.includes('defended')) return 'defended';
  return '';
}

function render(d) {
  const snap = d.snapshot;
  const state = d.state;
  document.getElementById('ts').textContent = new Date(snap.timestamp).toLocaleTimeString('en-IN');

  let statusHeadline, statusSub, cardClass = '';
  if (!state.strongest_side) {
    statusHeadline = "No clear OI cluster yet";
    statusSub = "Waiting for a 2-strike cluster to form on either side.";
  } else if (state.grab_flagged) {
    cardClass = 'grabbed';
    statusHeadline = `GRAB FLAGGED — watching for reversal`;
    statusSub = `Price hit the ${state.strongest_side} wall at ${fmtNum(state.wall_strike)} with a confirmed OI drop. Watching the next 10 minutes for a move back.`;
  } else {
    statusHeadline = `Strongest side: ${state.strongest_side}`;
    statusSub = `Watching wall at ${fmtNum(state.wall_strike)}. Spot currently ${fmtNum(snap.spot)}.`;
  }

  const distance = state.wall_strike ? Math.abs(snap.spot - state.wall_strike) : null;
  const distancePct = distance !== null ? Math.max(0, Math.min(100, 100 - (distance / 50 * 100))) : 0;

  const alertsHtml = (state.alerts || []).slice().reverse().map(a =>
    `<div class="alert-item ${alertClass(a)}">${a}</div>`
  ).join('') || '<div class="sub">No alerts yet today.</div>';

  document.getElementById('content').innerHTML = `
    <div class="status-card ${cardClass}">
      <div class="status-eyebrow">Live status</div>
      <div class="status-headline mono">${statusHeadline}</div>
      <div class="status-sub">${statusSub}</div>
    </div>

    <div class="grid">
      <div class="card">
        <div class="lbl">Spot</div>
        <div class="val mono">${fmtNum(snap.spot)}</div>
      </div>
      <div class="card">
        <div class="lbl">Wall strike</div>
        <div class="val mono">${fmtNum(state.wall_strike)}</div>
        <div class="sub">${state.strongest_side || '-'} side</div>
      </div>
      <div class="card" style="grid-column: 1 / 3;">
        <div class="lbl">Distance to wall</div>
        <div class="val mono">${distance !== null ? fmtNum(distance) + ' pts' : '-'}</div>
        <div class="distance-track"><div class="distance-fill" style="width:${distancePct}%"></div></div>
      </div>
    </div>

    <div class="section-title">Today's alert feed</div>
    <div class="alert-feed">${alertsHtml}</div>

    <div class="disclaimer">
      Decision support only — this never places trades. Grab/reversal calls need an
      OI cluster (2 strikes within 15% OI of each other) and an 8%+ OI drop at the
      wall to confirm. Refreshes every ${REFRESH_MS/1000}s. Pre-9:30 readings are
      logged but not acted on.
    </div>
  `;
}

load();
setInterval(load, REFRESH_MS);
</script>
</body>
</html>
