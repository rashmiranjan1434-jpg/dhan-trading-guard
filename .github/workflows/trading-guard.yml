name: Dhan Trading Guard

# Triggered externally by cron-job.org every minute during market hours
# (IST 9:00am-8:00pm) via the GitHub API - NOT by GitHub's own `schedule:`
# trigger, which proved unreliable (silently skipped runs for 90+ minutes
# on two separate mornings, Aug 20 and 21). Removed here on purpose.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "What to run"
        required: true
        default: "check"
        type: choice
        options:
          - check
          - setup-pnl-exit
          - pnl-exit-status
          - remove-pnl-exit
          - check-proxy-ip

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install dhanhq

      - name: Run guard check
        if: github.event.inputs.mode == 'check' || github.event.inputs.mode == ''
        env:
          DHAN_CLIENT_ID: ${{ secrets.DHAN_CLIENT_ID }}
          DHAN_ACCESS_TOKEN: ${{ secrets.DHAN_ACCESS_TOKEN }}
        run: |
          python3 dhan_trading_guard.py \
            --once \
            --capital ${{ vars.GUARD_CAPITAL || '45000' }} \
            --loss-pct ${{ vars.GUARD_LOSS_PCT || '5' }} \
            --max-trades ${{ vars.GUARD_MAX_TRADES || '2' }} \
            --state-file guard_state.json \
            ${{ vars.GUARD_DRY_RUN == 'false' && ' ' || '--dry-run' }}

      - name: Set up today's P&L Exit with Dhan
        if: github.event.inputs.mode == 'setup-pnl-exit'
        env:
          DHAN_CLIENT_ID: ${{ secrets.DHAN_CLIENT_ID }}
          DHAN_ACCESS_TOKEN: ${{ secrets.DHAN_ACCESS_TOKEN }}
          STATICIP_PROXY_URL: ${{ secrets.STATICIP_PROXY_URL }}
        run: |
          python3 dhan_trading_guard.py \
            --setup-pnl-exit \
            --capital ${{ vars.GUARD_CAPITAL || '45000' }} \
            --loss-pct ${{ vars.GUARD_LOSS_PCT || '5' }}

      - name: Check today's P&L Exit status
        if: github.event.inputs.mode == 'pnl-exit-status'
        env:
          DHAN_CLIENT_ID: ${{ secrets.DHAN_CLIENT_ID }}
          DHAN_ACCESS_TOKEN: ${{ secrets.DHAN_ACCESS_TOKEN }}
          STATICIP_PROXY_URL: ${{ secrets.STATICIP_PROXY_URL }}
        run: python3 dhan_trading_guard.py --pnl-exit-status

      - name: Remove today's P&L Exit
        if: github.event.inputs.mode == 'remove-pnl-exit'
        env:
          DHAN_CLIENT_ID: ${{ secrets.DHAN_CLIENT_ID }}
          DHAN_ACCESS_TOKEN: ${{ secrets.DHAN_ACCESS_TOKEN }}
          STATICIP_PROXY_URL: ${{ secrets.STATICIP_PROXY_URL }}
        run: python3 dhan_trading_guard.py --remove-pnl-exit

      - name: Check what IP the proxy actually presents
        if: github.event.inputs.mode == 'check-proxy-ip'
        env:
          STATICIP_PROXY_URL: ${{ secrets.STATICIP_PROXY_URL }}
        run: |
          echo "Direct (no proxy) egress IP - what GitHub Actions itself uses:"
          curl -s https://api64.ipify.org
          echo ""
          echo "Through the proxy - should show 178.94.250.19:"
          curl -s -x "$STATICIP_PROXY_URL" https://api64.ipify.org
          echo ""

      - name: Commit updated state file
        if: github.event.inputs.mode == 'check' || github.event.inputs.mode == ''
        run: |
          git config user.name "trading-guard-bot"
          git config user.email "actions@users.noreply.github.com"
          git add guard_state.json
          git diff --quiet --cached || git commit -m "Update guard state [skip ci]"
          git push
